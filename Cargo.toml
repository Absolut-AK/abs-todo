[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package]
name = "abs_todo"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "system_fonts", "clipboard", "glow", "x11"] }
sysinfo = "0.40.1"
